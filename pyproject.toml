[project]
name = "codo"
version = "0.1.0"
description = "A CodeRabbit-style AI code review GitHub App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-anthropic>=0.3",
    "arq>=0.26",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "stripe>=11.4",
]

[project.optional-dependencies]
# Extra inference providers (LangChain integrations). Groq + Anthropic ship by default.
openai = ["langchain-openai>=0.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
